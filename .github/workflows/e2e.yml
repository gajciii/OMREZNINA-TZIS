name: E2E Tests with Cypress

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund

      - name: Build project
        run: npm --prefix frontend run build

      - name: Start local application
        run: docker compose up --build --detach
        env:
          WEATHER_ENABLED: 'false'

      - name: Wait for local application
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5173/api/health; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Check local services and storage
        run: npm run smoke

      - name: Run Cypress tests manually
        working-directory: frontend
        run: npx cypress run
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173

      - name: Save logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop local application
        if: always()
        run: docker compose down
