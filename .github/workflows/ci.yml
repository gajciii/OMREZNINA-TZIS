name: Build, analyze and test

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        working-directory: ./backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B verify -Pno-integration-tests org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.projectKey=gajciii_OMREZNINA-TZIS \
            -Dsonar.organization=gajciii \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  cypress-run:
    name: Smoke, parser and Cypress
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: omreznina-e2e
      WEATHER_ENABLED: 'false'
      OPENWEATHER_API_KEY: ''
      CYPRESS_BASE_URL: http://127.0.0.1:5173
      E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund

      - name: Build project
        run: npm --prefix frontend run build

      - name: Verify Cypress installation
        working-directory: frontend
        run: npx cypress verify

      - name: Start local application
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Wait for local application
        run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5173/api/health

      - name: Check local services and storage
        run: npm run smoke

      - name: Check daily CSV and XLSX parser regressions
        run: docker compose exec -T parser python -m unittest discover -s tests -v

      - name: Run functional and existing Cypress tests
        run: npm --prefix frontend run test:e2e

      - name: Collect application logs
        if: always()
        run: |
          mkdir -p frontend/cypress/results
          docker compose logs --no-color > frontend/cypress/results/docker-compose.log 2>&1

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cypress-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/cypress/results/
            frontend/cypress/screenshots/
            frontend/cypress/videos/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop local application
        if: always()
        run: docker compose down
