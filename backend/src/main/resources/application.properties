spring.application.name=omreznina
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local Firebase emulators are the default. Cloud access must be opted into.
firebase.mode=${FIREBASE_MODE:emulator}
firebase.project-id=${FIREBASE_PROJECT_ID:demo-omreznina}
firebase.firestore-emulator-host=${FIRESTORE_EMULATOR_HOST:127.0.0.1:8081}

helpers.parser.base-url=${PARSER_BASE_URL:http://127.0.0.1:8001}
helpers.power.base-url=${POWER_BASE_URL:http://127.0.0.1:8002}
helpers.prediction.base-url=${PREDICTION_BASE_URL:http://127.0.0.1:8003}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
location.latitude=${LOCAL_LATITUDE:46.0569}
location.longitude=${LOCAL_LONGITUDE:14.5058}
location.ip-lookup-enabled=${IP_LOCATION_ENABLED:false}

# Optional integrations; the rest of the application works without these keys.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0
openweather.api.key=${OPENWEATHER_API_KEY:}

# Keep this value stable while using saved MFA settings.
mfa.secret.encryption-key=${MFA_ENCRYPTION_KEY:omreznina-local-mfa-key-12345678}
